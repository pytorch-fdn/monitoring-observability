name: "Tofu Apply"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform_apply_prod:
    name: "Tofu Apply - Prod"
    # Dispatch can target any branch; only apply from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/opentofu-apply.yml
    with:
      environment: prod
      # workflow_dispatch is not a PR event, so dflook cannot fetch a
      # reviewed plan from a PR comment. Generate and apply a fresh plan
      # of main instead. Merge-to-main keeps auto_approve false.
      opentofu_auto_approve: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      opentofu_backend_config: |
        bucket=opentofu-state-pytorch-datadog
        dynamodb_table=opentofu-state-pytorch-datadog
    secrets:
      env_secret: |
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
      opentofu_secret_variables: |
        datadog_api_key = "${{ secrets.DD_API_KEY }}"
        datadog_app_key = "${{ secrets.DD_APP_KEY }}"
        incident_io_bearer = "${{ secrets.INCIDENT_IO_BEARER }}"
        cloudflare_api_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
